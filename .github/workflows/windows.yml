name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # jpackage builds the installers with a bundled Java runtime, so players don't need Java installed
      - name: Build the installers and the portable app
        run: ./gradlew :desktop:packageExe :desktop:packageMsi :desktop:createDistributable --stacktrace

      - name: Zip the portable app
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/HustleCity -DestinationPath desktop/build/HustleCity-portable.zip

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: hustle-city-windows-installer
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi

      - name: Upload the portable app
        uses: actions/upload-artifact@v4
        with:
          name: hustle-city-windows-portable
          path: desktop/build/HustleCity-portable.zip

      # a pushed version tag (v1.7.0, ...) publishes a GitHub release with the downloads
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/HustleCity-portable.zip
