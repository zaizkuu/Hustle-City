name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # the reference GLSL compiler, so the shader check can compile every shader for Android and for Windows
      - name: Install glslang
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends glslang-tools

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # the Windows version's render checks, with the HD renderer on Mesa's software OpenGL
      - name: Desktop tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :desktop:test -PgpuTest --stacktrace

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hustle-city-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Upload render snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: |
            app/build/snapshots/
            desktop/build/snapshots/
          if-no-files-found: ignore
