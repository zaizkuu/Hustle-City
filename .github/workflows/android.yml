name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # the reference GLSL compiler, so the shader check can compile every shader for Android and for Windows
      - name: Install glslang
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends glslang-tools

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # the Windows version's render checks, with the HD renderer on Mesa's software OpenGL
      - name: Desktop tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :desktop:test -PgpuTest --stacktrace

      # the permanent release key, from the repository's secrets (HUSTLE_KEYSTORE_B64: the .jks file in base64;
      # HUSTLE_KEYSTORE_PASSWORD: its password). Without them the release APK gets a throwaway debug key.
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.HUSTLE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HUSTLE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No HUSTLE_KEYSTORE_B64 secret: app-release.apk is signed with a throwaway debug key and can't update an installed copy"
          fi

      - name: Build APKs
        env:
          HUSTLE_KEYSTORE_PASSWORD: ${{ secrets.HUSTLE_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hustle-city-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Upload render snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: |
            app/build/snapshots/
            desktop/build/snapshots/
          if-no-files-found: ignore
