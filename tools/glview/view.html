<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}
#gl,#ov{position:absolute;left:0;top:0}
</style></head><body>
<canvas id="gl"></canvas><img id="ov">
<script>
// Renders a frame dumped by GpuFrameDumpTest with WebGL2, mirroring GlWorldView.Renderer call for call.
const q = new URLSearchParams(location.search);
const base = q.get('f');          // frame directory (URL path)
const shaders = q.get('s');       // directory holding world.vs/world.fs/sky.vs/sky.fs
const noOverlay = q.get('nooverlay') === '1';
const fast = q.get('fast') === '1';     // the cheaper shader variant used on mid-range phones
async function bin(p) { const r = await fetch(p); if (!r.ok) throw new Error('missing ' + p); return new Int32Array(await r.arrayBuffer()); }
async function txt(p) { const r = await fetch(p); if (!r.ok) throw new Error('missing ' + p); return r.text(); }
function compile(gl, type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(gl, vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
(async () => {
  try {
    const f = JSON.parse(await txt(base + '/frame.json'));
    const c = document.getElementById('gl');
    c.width = f.width; c.height = f.height;
    const gl = c.getContext('webgl2', { antialias: true, preserveDrawingBuffer: true });
    const world = program(gl, await txt(shaders + '/world.vs'), await txt(shaders + (fast ? '/world_fast.fs' : '/world.fs')));
    const sky = program(gl, await txt(shaders + '/sky.vs'), await txt(shaders + '/sky.fs'));
    const shadowProg = program(gl, await txt(shaders + '/shadow.vs'), await txt(shaders + '/shadow.fs'));
    const vbo = [], ibo = [], counts = [];
    for (let i = 0; i < 3; i++) {
      const v = await bin(base + '/v' + i + '.bin'), ix = await bin(base + '/i' + i + '.bin');
      vbo[i] = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo[i]); gl.bufferData(gl.ARRAY_BUFFER, v, gl.STREAM_DRAW);
      ibo[i] = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo[i]); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(ix.buffer), gl.STREAM_DRAW);
      counts[i] = ix.length;
    }
    const skyBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    // shadow map: depth texture rendered from the sun (mirrors GlWorldView.Renderer.shadowPass)
    const shadowTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, shadowTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, f.shadowSize, f.shadowSize, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, shadowTex, 0);
    gl.drawBuffers([gl.NONE]); gl.readBuffer(gl.NONE);
    if (f.shadow[3] > 0.5 && counts[1]) {
      gl.viewport(0, 0, f.shadowSize, f.shadowSize);
      gl.depthMask(true); gl.clear(gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.BLEND);
      gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(2, 4);
      gl.useProgram(shadowProg);
      gl.uniformMatrix4fv(gl.getUniformLocation(shadowProg, 'uLight'), false, new Float32Array(f.light));
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo[1]); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo[1]);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
      for (let a = 1; a <= 3; a++) gl.disableVertexAttribArray(a);
      gl.drawElements(gl.TRIANGLES, counts[1], gl.UNSIGNED_INT, 0);
      gl.disable(gl.POLYGON_OFFSET_FILL);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const cc = f.clearColor >>> 0;
    gl.viewport(0, 0, f.width, f.height);
    gl.clearColor(((cc >> 16) & 255) / 255, ((cc >> 8) & 255) / 255, (cc & 255) / 255, 1);
    gl.depthMask(true); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const U = (p, n) => gl.getUniformLocation(p, n);
    const v3 = (p, n, a) => gl.uniform3f(U(p, n), a[0], a[1], a[2]);
    if (f.misc[3] == 0) {
      gl.useProgram(sky); gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.BLEND);
      v3(sky, 'uRight', f.right); v3(sky, 'uUp', f.up); v3(sky, 'uFwd', f.fwd);
      gl.uniform3f(U(sky, 'uProj'), f.focal, f.centerX, f.centerY); gl.uniform2f(U(sky, 'uViewport'), f.width, f.height);
      v3(sky, 'uSkyTop', f.skyTop); v3(sky, 'uSkyHorizon', f.skyHorizon); v3(sky, 'uFogColor', f.fogColor);
      v3(sky, 'uSunDir', f.sunDir); v3(sky, 'uSunColor', f.sunColor); gl.uniform4f(U(sky, 'uMisc'), ...f.misc);
      gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
      for (let a = 1; a <= 3; a++) gl.disableVertexAttribArray(a);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.useProgram(world);
    v3(world, 'uCam', f.cam); v3(world, 'uRight', f.right); v3(world, 'uUp', f.up); v3(world, 'uFwd', f.fwd);
    gl.uniform3f(U(world, 'uProj'), f.focal, f.centerX, f.centerY); gl.uniform2f(U(world, 'uViewport'), f.width, f.height);
    gl.uniform2f(U(world, 'uNearFar'), f.near, f.far);
    v3(world, 'uSunDir', f.sunDir); v3(world, 'uSunColor', f.sunColor); v3(world, 'uSkyAmb', f.skyAmbient); v3(world, 'uGroundAmb', f.groundAmbient);
    v3(world, 'uFogColor', f.fogColor); gl.uniform3f(U(world, 'uFog'), ...f.fog); gl.uniform4f(U(world, 'uMisc'), ...f.misc);
    gl.uniformMatrix4fv(U(world, 'uLight'), false, new Float32Array(f.light));
    gl.uniform4f(U(world, 'uShadow'), ...f.shadow);
    v3(world, 'uSkyTop', f.skyTop); v3(world, 'uSkyHorizon', f.skyHorizon);
    gl.uniform1f(U(world, 'uTime'), f.time);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, shadowTex); gl.uniform1i(U(world, 'uShadowMap'), 0);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    function draw(i) {
      if (!counts[i]) return;
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo[i]); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo[i]);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12);
      gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.UNSIGNED_BYTE, true, 32, 24);
      gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 32, 28);
      gl.drawElements(gl.TRIANGLES, counts[i], gl.UNSIGNED_INT, 0);
    }
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false); draw(0);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true); draw(1);
    gl.depthMask(false); draw(2); gl.depthMask(true);
    const err = gl.getError();
    if (!noOverlay) { const o = document.getElementById('ov'); o.src = base + '/overlay.png'; }
    document.title = 'done ' + (err ? 'glerror ' + err : 'ok') + ' tris ' + f.triangles;
  } catch (e) { document.body.innerHTML = '<pre style="color:#f55;font:16px monospace;white-space:pre-wrap">' + e + '</pre>'; document.title = 'error'; }
})();
</script></body></html>
