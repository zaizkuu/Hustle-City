<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}
canvas{position:absolute;left:0;top:0}
</style></head><body>
<canvas id="gl"></canvas>
<script>
// Renders frame sequences written by CinemaWriter, mirroring GlWorldView.Renderer: the cached city geometry (uploaded
// once per cache version), then each frame's own geometry, with the sun's shadow map, sky, fog and materials.
let gl, world, sky, shadowProg, skyBuf, shadowTex, fbo, shadowSizeNow = 0;
const stat = { version: null, vbo: [], ibo: [], n: [0, 0, 0] };
const dyn = { vbo: [], ibo: [], n: [0, 0, 0] };
async function bin(p) { const r = await fetch(p); if (!r.ok) throw new Error('missing ' + p); return new Int32Array(await r.arrayBuffer()); }
async function txt(p) { const r = await fetch(p); if (!r.ok) throw new Error('missing ' + p); return r.text(); }
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
async function upload(set, base) {
  for (let i = 0; i < 3; i++) {
    const v = await bin(base + '/v' + i + '.bin'), ix = await bin(base + '/i' + i + '.bin');
    if (!set.vbo[i]) { set.vbo[i] = gl.createBuffer(); set.ibo[i] = gl.createBuffer(); }
    gl.bindBuffer(gl.ARRAY_BUFFER, set.vbo[i]); gl.bufferData(gl.ARRAY_BUFFER, v, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, set.ibo[i]); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(ix.buffer), gl.STATIC_DRAW);
    set.n[i] = ix.length;
  }
}
let opts = {};
window.init = async (shaders, w, h, o) => {
  opts = o || {};
  const c = document.getElementById('gl');
  c.width = w; c.height = h;
  gl = c.getContext('webgl2', { antialias: opts.msaa !== false, preserveDrawingBuffer: true });
  world = program(await txt(shaders + '/world.vs'), await txt(shaders + '/world.fs'));
  sky = program(await txt(shaders + '/sky.vs'), await txt(shaders + '/sky.fs'));
  shadowProg = program(await txt(shaders + '/shadow.vs'), await txt(shaders + '/shadow.fs'));
  skyBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  shadowTex = gl.createTexture(); fbo = gl.createFramebuffer();
  return 'ok';
};
function ensureShadow(size) {
  if (size === shadowSizeNow) return;
  shadowSizeNow = size;
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, size, size, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, shadowTex, 0);
  gl.drawBuffers([gl.NONE]); gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
function bindWorld(set, i, positionsOnly) {
  gl.bindBuffer(gl.ARRAY_BUFFER, set.vbo[i]); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, set.ibo[i]);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
  if (positionsOnly) { for (let a = 1; a <= 3; a++) gl.disableVertexAttribArray(a); return; }
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 32, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.UNSIGNED_BYTE, true, 32, 24);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 32, 28);
}
// draws indices [a, b) of a stream
function drawRange(set, i, a, b, positionsOnly) {
  if (b <= a) return;
  bindWorld(set, i, positionsOnly);
  gl.drawElements(gl.TRIANGLES, b - a, gl.UNSIGNED_INT, a * 4);
}
function drawStatic(i, skip, positionsOnly) {
  if (stat.version === null || !stat.n[i]) return;
  if (i === 1 && skip.length) {
    let from = 0;
    for (let k = 0; k < skip.length; k += 2) { drawRange(stat, i, from, skip[k], positionsOnly); from = skip[k + 1]; }
    drawRange(stat, i, from, stat.n[i], positionsOnly);
  } else drawRange(stat, i, 0, stat.n[i], positionsOnly);
}
window.renderFrame = async (base, staticBase) => {
  const f = JSON.parse(await txt(base + '/frame.json'));
  if (opts.shadow && opts.shadow !== f.shadowSize) { f.shadow[1] *= f.shadowSize / opts.shadow; f.shadow[2] = 1 / opts.shadow; f.shadowSize = opts.shadow; }
  if (opts.noShadow) f.shadow[3] = 0;
  if (f.static >= 0 && stat.version !== f.static) { await upload(stat, staticBase + '/static_' + f.static); stat.version = f.static; }
  if (f.static < 0) { stat.n = [0, 0, 0]; stat.version = null; }
  await upload(dyn, base);
  const skip = f.skip || [];
  ensureShadow(f.shadowSize);
  if (f.shadow[3] > 0.5) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, f.shadowSize, f.shadowSize);
    gl.depthMask(true); gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.BLEND);
    gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(2, 4);
    gl.useProgram(shadowProg);
    gl.uniformMatrix4fv(gl.getUniformLocation(shadowProg, 'uLight'), false, new Float32Array(f.light));
    if (dyn.n[1]) drawRange(dyn, 1, 0, dyn.n[1], true);
    drawStatic(1, skip, true);
    gl.disable(gl.POLYGON_OFFSET_FILL);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  const cc = f.clearColor >>> 0;
  gl.viewport(0, 0, f.width, f.height);
  gl.clearColor(((cc >> 16) & 255) / 255, ((cc >> 8) & 255) / 255, (cc & 255) / 255, 1);
  gl.depthMask(true); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const U = (p, n) => gl.getUniformLocation(p, n);
  const v3 = (p, n, a) => gl.uniform3f(U(p, n), a[0], a[1], a[2]);
  if (f.misc[3] == 0) {
    gl.useProgram(sky); gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.BLEND);
    v3(sky, 'uRight', f.right); v3(sky, 'uUp', f.up); v3(sky, 'uFwd', f.fwd);
    gl.uniform3f(U(sky, 'uProj'), f.focal, f.centerX, f.centerY); gl.uniform2f(U(sky, 'uViewport'), f.width, f.height);
    v3(sky, 'uSkyTop', f.skyTop); v3(sky, 'uSkyHorizon', f.skyHorizon); v3(sky, 'uFogColor', f.fogColor);
    v3(sky, 'uSunDir', f.sunDir); v3(sky, 'uSunColor', f.sunColor); gl.uniform4f(U(sky, 'uMisc'), ...f.misc);
    gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
    for (let a = 1; a <= 3; a++) gl.disableVertexAttribArray(a);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.useProgram(world);
  v3(world, 'uCam', f.cam); v3(world, 'uRight', f.right); v3(world, 'uUp', f.up); v3(world, 'uFwd', f.fwd);
  gl.uniform3f(U(world, 'uProj'), f.focal, f.centerX, f.centerY); gl.uniform2f(U(world, 'uViewport'), f.width, f.height);
  gl.uniform2f(U(world, 'uNearFar'), f.near, f.far);
  v3(world, 'uSunDir', f.sunDir); v3(world, 'uSunColor', f.sunColor); v3(world, 'uSkyAmb', f.skyAmbient); v3(world, 'uGroundAmb', f.groundAmbient);
  v3(world, 'uFogColor', f.fogColor); gl.uniform3f(U(world, 'uFog'), ...f.fog); gl.uniform4f(U(world, 'uMisc'), ...f.misc);
  gl.uniformMatrix4fv(U(world, 'uLight'), false, new Float32Array(f.light));
  gl.uniform4f(U(world, 'uShadow'), ...f.shadow);
  v3(world, 'uSkyTop', f.skyTop); v3(world, 'uSkyHorizon', f.skyHorizon);
  gl.uniform1f(U(world, 'uTime'), f.time);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, shadowTex); gl.uniform1i(U(world, 'uShadowMap'), 0);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  // ground layers in order without depth, then solid geometry, then see-through
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  drawStatic(0, skip, false); if (dyn.n[0]) drawRange(dyn, 0, 0, dyn.n[0], false);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
  if (dyn.n[1]) drawRange(dyn, 1, 0, dyn.n[1], false);
  drawStatic(1, skip, false);
  gl.depthMask(false);
  drawStatic(2, skip, false); if (dyn.n[2]) drawRange(dyn, 2, 0, dyn.n[2], false);
  gl.depthMask(true);
  gl.finish();
  const err = gl.getError();
  return err ? 'glerror ' + err : 'ok';
};
</script></body></html>
